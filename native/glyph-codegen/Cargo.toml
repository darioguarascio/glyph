[package]
name = "glyph-codegen"
description = "GBC bytecode to native code via Cranelift"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glyph-ir = { path = "../glyph-ir" }
cranelift = "0.117"
cranelift-module = "0.117"
cranelift-object = "0.117"
cranelift-frontend = "0.117"
cranelift-native = "0.117"
target-lexicon = "0.13"
anyhow = "1"
tempfile = "3"

[dev-dependencies]
glyph-frontend = { path = "../glyph-frontend" }
